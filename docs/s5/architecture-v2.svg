<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1E3A8A">MetroCert — Architecture V2 (S5)</text>
  <text x="40" y="70" font-size="14" fill="#475569">MVP Lovable → Webhook → Agent Dify → RAG → Base de connaissances → Rapport de contrôle</text>

  <!-- User -->
  <rect x="40" y="130" width="170" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="125" y="165" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">Technicien /</text>
  <text x="125" y="185" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">resp. technique</text>
  <text x="125" y="212" font-size="12" text-anchor="middle" fill="#475569">saisit les relevés,</text>
  <text x="125" y="228" font-size="12" text-anchor="middle" fill="#475569">approuve (humain)</text>

  <!-- MVP -->
  <rect x="250" y="110" width="270" height="190" rx="12" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="385" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#1E3A8A">MVP Lovable (lovable.app)</text>
  <text x="280" y="168" font-size="12" fill="#0F172A">• Nouveau certificat : relevés</text>
  <text x="280" y="186" font-size="12" fill="#0F172A">• Calcul : E = lecture − référence</text>
  <text x="280" y="204" font-size="12" fill="#0F172A">• U (k = 2) saisie depuis le budget</text>
  <text x="280" y="222" font-size="12" fill="#0F172A">• Règle de décision ILAC G8</text>
  <text x="280" y="240" font-size="12" fill="#0F172A">• Aperçu certificat §7.8</text>
  <text x="280" y="258" font-size="12" fill="#0F172A">• « Contrôler avec l'agent » /</text>
  <text x="290" y="276" font-size="12" fill="#0F172A">« Demander à l'agent »</text>

  <!-- Webhook -->
  <rect x="565" y="150" width="160" height="110" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="645" y="180" font-size="15" font-weight="700" text-anchor="middle" fill="#0369A1">Webhook / API</text>
  <text x="645" y="204" font-size="11" text-anchor="middle" fill="#0F172A">POST api.dify.ai/v1/</text>
  <text x="645" y="220" font-size="11" text-anchor="middle" fill="#0F172A">workflows/run</text>
  <text x="645" y="242" font-size="10" text-anchor="middle" fill="#475569">inputs.question · Bearer</text>

  <!-- Dify workflow -->
  <rect x="770" y="100" width="390" height="250" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="965" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#C2410C">Dify — MetroCert_ControleCertificat_v1</text>
  <text x="965" y="146" font-size="11" text-anchor="middle" fill="#9A3412">(application L1 de la S3, enrichie du RAG en S5)</text>
  <g font-size="12" fill="#0F172A">
    <rect x="790" y="165" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text x="840" y="184" text-anchor="middle">Début</text><text x="840" y="198" text-anchor="middle" font-size="10">(question)</text>
    <rect x="915" y="165" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text x="975" y="183" text-anchor="middle">Récupération</text><text x="975" y="198" text-anchor="middle">connaissances</text>
    <rect x="1055" y="165" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text x="1100" y="190" text-anchor="middle">CHERCHEUR</text>
    <rect x="1055" y="235" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text x="1100" y="260" text-anchor="middle">RÉDACTEUR</text>
    <rect x="790" y="235" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text x="840" y="254" text-anchor="middle">Fin</text><text x="840" y="268" text-anchor="middle" font-size="10">(rapport_controle)</text>
  </g>
  <line x1="890" y1="185" x2="913" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1035" y1="185" x2="1053" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1100" y1="205" x2="1100" y2="233" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1055" y1="255" x2="892" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="790" y="302" font-size="11" fill="#475569">Contexte injecté, Top K 3</text>
  <text x="790" y="320" font-size="11" fill="#475569">Cohérence des verdicts</text>
  <text x="790" y="338" font-size="11" fill="#475569">Aucun calcul par l'IA</text>

  <!-- KB -->
  <rect x="770" y="400" width="390" height="180" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="965" y="428" font-size="16" font-weight="700" text-anchor="middle" fill="#15803D">Base RAG MetroCert_KB_v1 (Économique)</text>
  <text x="790" y="458" font-size="12" fill="#0F172A">✓ Rapport HICEB2026AM140, balance 210 g (indexé)</text>
  <text x="790" y="480" font-size="12" fill="#0F172A">+ 01 Exigences ISO/IEC 17025 §7.8 (à ajouter)</text>
  <text x="790" y="502" font-size="12" fill="#0F172A">+ 02 Règles ILAC G8 · 03 Familles (à ajouter)</text>
  <text x="790" y="524" font-size="12" fill="#0F172A">+ 04 Registre des étalons (à ajouter)</text>
  <text x="790" y="556" font-size="11" fill="#475569">Découpage par section ## · index inversé · Top K 3</text>
  <line x1="975" y1="398" x2="975" y2="207" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="985" y="385" font-size="11" fill="#15803D">passages pertinents</text>

  <!-- Arrows main -->
  <line x1="210" y1="185" x2="258" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="190" x2="563" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="536" y="182" font-size="11" fill="#475569">1</text>
  <line x1="725" y1="190" x2="768" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="740" y="182" font-size="11" fill="#475569">2</text>
  <!-- return path -->
  <path d="M790 262 L745 262 L745 380 L385 380 L385 302" fill="none" stroke="#1E3A8A" stroke-width="2" marker-end="url(#a)"/>
  <text x="395" y="402" font-size="12" fill="#1E3A8A">3 — outputs.rapport_controle (verdict, incohérences)</text>

  <!-- Footer -->
  <rect x="40" y="420" width="690" height="160" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="60" y="450" font-size="14" font-weight="700" fill="#0F172A">Principes de conception</text>
  <text x="60" y="476" font-size="12" fill="#0F172A">• Les calculs (erreurs, conformité) sont déterministes et vérifiables dans le MVP.</text>
  <text x="60" y="498" font-size="12" fill="#0F172A">• L'agent relit et cite l'exigence (MC-xx / RD-xx) ; il n'approuve jamais.</text>
  <text x="60" y="520" font-size="12" fill="#0F172A">• L'approbation reste la signature d'une personne autorisée (§7.8.2.1 o).</text>
  <text x="60" y="542" font-size="12" fill="#0F172A">• Prototype : données fictives uniquement ; clé API côté client (fonction serveur en V3).</text>
  <text x="60" y="564" font-size="12" fill="#0F172A">• Plan B S6 : « Mode démo » avec réponse enregistrée si l'API est indisponible.</text>
  <text x="40" y="620" font-size="11" fill="#94A3B8">GET 409 · Équipe MetroCert (I. NKOUNKOU, M. S. COULIBALY) · Swiss UMEF — Campus de Dakar · S5</text>
</svg>
